name: Docker

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild so Go and Alpine security fixes (e.g. CA trust changes)
  # reach :latest even when no code changes are pushed.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # goolm = pure-Go olm, so the runner needs no libolm; the Docker image
      # is built with libolm below.
      - run: go build -tags goolm ./...
      - run: go vet -tags goolm ./pkg/... ./cmd/...
      # internal/hermes is left out until its tests/fixtures directory is
      # restored; those tests fail on missing files, not on code.
      - run: go test -tags goolm ./pkg/... ./cmd/... ./internal/hermes/fcm/...

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOFLAGS: -tags=goolm
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  docker-amd64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:latest-amd64

  docker-arm64:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository }}:latest-arm64

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:latest-amd64 \
            ghcr.io/${{ github.repository }}:latest-arm64
